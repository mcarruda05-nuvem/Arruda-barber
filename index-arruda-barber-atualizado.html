
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Arruda Barber</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080808;
 color:#fff;
 font-family:Arial,sans-serif;
}
header{
 text-align:center;
 padding:35px 15px 25px;
 background:#111;
 border-bottom:1px solid #b99143;
}
.logo{
 color:#d5ad60;
 font-size:34px;
 font-weight:bold;
 letter-spacing:3px;
}
header p{color:#bbb;letter-spacing:2px}
main{
 max-width:520px;
 margin:25px auto;
 padding:20px;
}
h2{color:#d5ad60;text-align:center}
label{
 display:block;
 margin:18px 0 8px;
 color:#d5ad60;
 font-weight:bold;
}
input,select{
 width:100%;
 padding:15px;
 border:1px solid #a98543;
 border-radius:8px;
 background:#171717;
 color:white;
 font-size:16px;
}
button{
 width:100%;
 margin-top:25px;
 padding:17px;
 background:#c49a4e;
 color:#080808;
 border:0;
 border-radius:8px;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}
button:active{opacity:.8}
.info{
 margin-top:25px;
 text-align:center;
 color:#aaa;
 font-size:13px;
}
footer{
 text-align:center;
 padding:25px;
 color:#888;
 border-top:1px solid #333;
}
</style>
</head>
<body>

<header>
 <div class="logo">ARRUDA BARBER</div>
 <p>ESTILO • QUALIDADE • TRADIÇÃO</p>
</header>

<main>
 <h2>Agende seu horário</h2>

 <label for="cliente">Seu nome</label>
 <input id="cliente" type="text" placeholder="Digite seu nome">

 <label for="servico">Escolha o serviço</label>
 <select id="servico">
  <option value="">Selecione um serviço</option>
  <option value="Cabelo" data-min="35">Cabelo — 35 minutos</option>
  <option value="Cabelo e barba" data-min="55">Cabelo e barba — 55 minutos</option>
  <option value="Barba" data-min="25">Barba — 25 minutos</option>
  <option value="Sobrancelha com corte" data-min="5">Sobrancelha com corte — 5 minutos</option>
  <option value="Apenas sobrancelha" data-min="10">Apenas sobrancelha — 10 minutos</option>
  <option value="Pezinhos" data-min="15">Pezinhos — 15 minutos</option>
  <option value="1 pente e pezinho" data-min="20">1 pente e pezinho — 20 minutos</option>
  <option value="2 pentes e pezinho" data-min="25">2 pentes e pezinho — 25 minutos</option>
 </select>

 <label for="profissional">Escolha o profissional</label>
 <select id="profissional">
  <option value="">Selecione</option>
  <option value="Arruda">Arruda</option>
  <option value="Felipe">Felipe</option>
  <option value="Thalita">Thalita</option>
 </select>

 <label for="data">Escolha o dia</label>
 <input id="data" type="date">

 <label for="horario">Escolha o horário</label>
 <select id="horario">
  <option value="">Primeiro escolha o serviço e o dia</option>
 </select>

 <button onclick="agendar()">AGENDAR PELO WHATSAPP</button>

 <div class="info">
  Atendimento de terça-feira a sábado<br>
  A partir das 9h
 </div>
</main>

<footer>
 ARRUDA BARBER © 2026
</footer>

<script>
// Preencha os números de Arruda e Felipe antes de publicar.
// Use somente números, incluindo 55 e o DDD.
const telefones = {
 "Arruda": "COLOQUE_AQUI_O_NUMERO_DO_ARRUDA",
 "Felipe": "COLOQUE_AQUI_O_NUMERO_DO_FELIPE",
 "Thalita": "55991692449"
};

// Horário de funcionamento provisório: 09h às 19h.
const ABERTURA = 9 * 60;
const FECHAMENTO = 19 * 60;
const INTERVALO = 15;

const dataInput = document.getElementById("data");
const servicoInput = document.getElementById("servico");
const horarioInput = document.getElementById("horario");

function dataLocal(d){
 const ano=d.getFullYear();
 const mes=String(d.getMonth()+1).padStart(2,"0");
 const dia=String(d.getDate()).padStart(2,"0");
 return `${ano}-${mes}-${dia}`;
}

const hoje=new Date();
dataInput.min=dataLocal(hoje);

function atualizarHorarios(){
 horarioInput.innerHTML='<option value="">Selecione um horário</option>';

 const data=dataInput.value;
 const servico=servicoInput.options[servicoInput.selectedIndex];
 const duracao=Number(servico.dataset.min);

 if(!data || !duracao){
  horarioInput.innerHTML='<option value="">Escolha o serviço e o dia</option>';
  return;
 }

 const dia=new Date(data+"T12:00:00").getDay();

 if(dia===0 || dia===1){
  horarioInput.innerHTML='<option value="">Fechado neste dia. Atendemos de terça a sábado.</option>';
  return;
 }

 const agora=new Date();
 const hojeSelecionado=data===dataLocal(agora);
 let encontrou=false;

 for(let minutos=ABERTURA; minutos+duracao<=FECHAMENTO; minutos+=INTERVALO){
  if(hojeSelecionado){
   const horaAtual=agora.getHours()*60+agora.getMinutes();
   if(minutos<=horaAtual) continue;
  }

  const h=String(Math.floor(minutos/60)).padStart(2,"0");
  const m=String(minutos%60).padStart(2,"0");
  const hora=`${h}:${m}`;

  horarioInput.add(new Option(hora,hora));
  encontrou=true;
 }

 if(!encontrou){
  horarioInput.innerHTML='<option value="">Não há horários disponíveis neste dia</option>';
 }
}

dataInput.addEventListener("change",atualizarHorarios);
servicoInput.addEventListener("change",atualizarHorarios);

function agendar(){
 const nome=document.getElementById("cliente").value.trim();
 const servico=servicoInput.value;
 const profissional=document.getElementById("profissional").value;
 const data=dataInput.value;
 const horario=horarioInput.value;

 if(!nome || !servico || !profissional || !data || !horario){
  alert("Preencha todos os campos para continuar.");
  return;
 }

 const numero=telefones[profissional];

 if(!numero || numero.includes("COLOQUE_AQUI")){
  alert("O WhatsApp deste profissional ainda precisa ser configurado. Entre em contato com a barbearia.");
  return;
 }

 const partes=data.split("-");
 const dataFormatada=`${partes[2]}/${partes[1]}/${partes[0]}`;

 const mensagem=
 `Olá, ${profissional}! Gostaria de confirmar meu agendamento na Arruda Barber.\n\n`+
 `Nome: ${nome}\n`+
 `Serviço: ${servico}\n`+
 `Profissional: ${profissional}\n`+
 `Data: ${dataFormatada}\n`+
 `Horário: ${horario}\n\n`+
 `Aguardo a confirmação.`;

 const link=`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;
 window.location.href=link;
}
</script>

</body>
</html>
